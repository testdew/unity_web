<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏运营选择器 - 优化版</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="picker-container theme-dark" id="pickerContainer">
        <!-- 右上角圆形关闭按钮 -->
        <button class="circle-close-btn" id="closeBtn">✕</button>

        <div class="picker-header">
            <h3>🎮 游戏运营工具箱</h3>
            <p>选择类型 → 选择子类型 → 点击文本 → 确认发送</p>
        </div>

        <!-- 风格选择器 -->
        <div class="filter-section">
            <div class="filter-group">
                <label>🎨 界面风格</label>
                <div class="style-buttons" id="styleButtons">
                    <button data-theme="dark" class="style-btn active">🌙 暗夜</button>
                    <button data-theme="pink" class="style-btn">🌸 粉嫩</button>
                    <button data-theme="cyber" class="style-btn">💻 赛博</button>
                    <button data-theme="white" class="style-btn">📄 简约</button>
                    <button data-theme="red" class="style-btn">🧧 中国红</button>
                </div>
            </div>
        </div>

        <!-- 翻译控制区 -->
        <div class="filter-section">
            <div class="filter-group">
                <label>🌐 翻译设置</label>
                <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                    <select id="translatorSelect" style="flex: 1; min-width: 100px; padding: 8px; border-radius: 8px;">
                        <option value="google">Google 翻译</option>
                        <option value="baidu">百度翻译</option>
                        <option value="microsoft">微软翻译</option>
                    </select>
                    <select id="langSelect" style="flex: 1; min-width: 100px; padding: 8px; border-radius: 8px;">
                        <option value="en">English</option>
                        <option value="zh">中文</option>
                        <option value="ja">日本語</option>
                        <option value="ko">한국어</option>
                        <option value="fr">Français</option>
                        <option value="de">Deutsch</option>
                        <option value="es">Español</option>
                        <option value="ru">Русский</option>
                    </select>
                    <button id="translateToggleBtn" class="style-btn" style="background: #667eea; color: white; padding: 8px 16px;">🔘 开启翻译</button>
                </div>
                <div id="translateStatus" style="font-size: 11px; margin-top: 8px; color: #888;">
                    ⚙️ 翻译状态：未启用
                </div>
            </div>
        </div>

        <div class="filter-section">
            <div class="filter-group">
                <label>📌 主类型</label>
                <select id="mainTypeSelect">
                    <option value="ban">🚫 封号类型</option>
                    <option value="announcement">📢 停服公告</option>
                    <option value="notice">ℹ️ 系统通知</option>
                    <option value="reward">🎁 补偿公告</option>
                    <option value="maintenance">🔧 维护公告</option>
                </select>
            </div>

            <div class="filter-group">
                <label>🔖 子类型</label>
                <select id="subTypeSelect"></select>
            </div>

            <div class="filter-group">
                <label>🔍 搜索推荐</label>
                <input type="text" id="searchInput" class="search-input" placeholder="输入关键词过滤...">
            </div>
        </div>

        <div class="recommend-section">
            <div class="section-title">
                📋 推荐文案 <span id="resultCount">0</span>
            </div>
            <ul class="option-list" id="optionList">
                <li class="empty-tip">请选择类型查看推荐</li>
            </ul>
        </div>

        <!-- 新增：输入框区域 -->
        <div class="selected-area">
            <div class="selected-header">
                <label>✏️ 已选内容</label>
                <button id="translateInputBtn" class="mini-btn" title="翻译输入框内容">🌐 翻译</button>
            </div>
            <div class="input-wrapper">
                <textarea id="selectedText" rows="2" placeholder="点击上方推荐文案后，内容会显示在这里，可以编辑修改..."></textarea>
            </div>
            <div class="action-buttons">
                <button id="confirmBtn" class="confirm-btn">✓ 确认发送</button>
                <button id="clearBtn" class="clear-btn">✗ 清空</button>
            </div>
        </div>
    </div>

    <!-- 翻译模块（必须按顺序） -->
    <script src="js/translators/translator-base.js"></script>
    <script src="js/translators/google-translator.js"></script>
    <script src="js/translators/baidu-translator.js"></script>
    <script src="js/translators/microsoft-translator.js"></script>
    <script src="js/translators/translator-manager.js"></script>

    <!-- 其他模块 -->
    <script src="js/theme-manager.js"></script>
    <script src="js/post-message.js"></script>
    <script src="js/data-loader.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
