<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏运营选择器 - 多风格翻译版</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* 新增样式 - 圆形关闭按钮 */
        .close-circle {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: inherit;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            z-index: 10;
        }
        .close-circle:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(90deg);
        }
        .picker-container {
            position: relative;
        }
        
        /* 输入框区域 */
        .selected-area {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .selected-label {
            font-size: 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .selected-input-wrapper {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .selected-input-wrapper input {
            flex: 1;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.3);
            color: inherit;
            font-size: 14px;
        }
        .selected-input-wrapper input:focus {
            outline: none;
            border-color: #667eea;
        }
        .translate-input-btn {
            padding: 8px 16px;
            border-radius: 12px;
            background: #667eea;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 12px;
        }
        .confirm-btn {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .confirm-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.05);
        }
        
        /* 翻译设置面板 - 默认隐藏 */
        .translate-settings-panel {
            display: none;
            margin-top: 12px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 16px;
        }
        .translate-settings-panel.show {
            display: block;
        }
        .settings-toggle {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 8px;
        }
        .settings-toggle:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
        
        /* 主题适配 */
        .theme-white .selected-input-wrapper input {
            background: #f5f5f5;
            border-color: #ddd;
            color: #333;
        }
        .theme-white .translate-settings-panel {
            background: #f0f0f0;
        }
        .theme-cyber .selected-input-wrapper input {
            border-color: #00ffcc;
        }
        .theme-red .confirm-btn {
            background: linear-gradient(135deg, #ffd700, #c41e3a);
        }
    </style>
</head>
<body>
    <div class="picker-container theme-dark" id="pickerContainer">
        <!-- 圆形关闭按钮 -->
        <button class="close-circle" id="closeCircleBtn">✕</button>
        
        <div class="picker-header">
            <h3>🎮 游戏运营工具箱</h3>
            <p>选择类型 → 选择子类型 → 点击文本添加到下方输入框</p>
        </div>

        <!-- 风格选择器 -->
        <div class="filter-section">
            <div class="filter-group">
                <label>🎨 界面风格</label>
                <div class="style-buttons" id="styleButtons">
                    <button data-theme="dark" class="style-btn active">🌙 暗夜</button>
                    <button data-theme="pink" class="style-btn">🌸 粉嫩</button>
                    <button data-theme="cyber" class="style-btn">💻 赛博</button>
                    <button data-theme="white" class="style-btn">📄 简约</button>
                    <button data-theme="red" class="style-btn">🧧 中国红</button>
                </div>
            </div>
        </div>

        <!-- 翻译设置面板（默认隐藏） -->
        <div class="filter-section">
            <div class="filter-group">
                <label>
                    🌐 翻译设置
                    <button type="button" class="settings-toggle" id="settingsToggleBtn">⚙️ 显示设置</button>
                </label>
                <div class="translate-settings-panel" id="translateSettingsPanel">
                    <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px;">
                        <select id="translatorSelect" style="flex: 1; padding: 8px; border-radius: 8px;">
                            <option value="google">Google 翻译</option>
                            <option value="baidu">百度翻译</option>
                            <option value="microsoft">微软翻译</option>
                        </select>
                        <select id="langSelect" style="flex: 1; padding: 8px; border-radius: 8px;">
                            <option value="en">English</option>
                            <option value="zh">中文</option>
                            <option value="ja">日本語</option>
                            <option value="ko">한국어</option>
                            <option value="fr">Français</option>
                            <option value="de">Deutsch</option>
                            <option value="es">Español</option>
                            <option value="ru">Русский</option>
                        </select>
                        <button id="translateToggleBtn" class="style-btn" style="background: #667eea; color: white; padding: 8px 16px;">🔘 开启翻译</button>
                    </div>
                    <div id="translateStatus" style="font-size: 11px; color: #888;">
                        ⚙️ 翻译状态：未启用
                    </div>
                </div>
            </div>
        </div>

        <div class="filter-section">
            <div class="filter-group">
                <label>📌 主类型</label>
                <select id="mainTypeSelect">
                    <option value="ban">🚫 封号类型</option>
                    <option value="announcement">📢 停服公告</option>
                    <option value="notice">ℹ️ 系统通知</option>
                    <option value="reward">🎁 补偿公告</option>
                    <option value="maintenance">🔧 维护公告</option>
                </select>
            </div>

            <div class="filter-group">
                <label>🔖 子类型</label>
                <select id="subTypeSelect"></select>
            </div>

            <div class="filter-group">
                <label>🔍 搜索推荐</label>
                <input type="text" id="searchInput" class="search-input" placeholder="输入关键词过滤...">
            </div>
        </div>

        <div class="recommend-section">
            <div class="section-title">
                📋 推荐文案 <span id="resultCount">0</span>
            </div>
            <ul class="option-list" id="optionList">
                <li class="empty-tip">请选择类型查看推荐</li>
            </ul>
        </div>

        <!-- 选中的内容区域 -->
        <div class="selected-area">
            <div class="selected-label">
                <span>📝 选中的内容</span>
                <button type="button" id="clearInputBtn" style="background:none; border:none; color:#888; cursor:pointer; font-size:12px;">清空</button>
            </div>
            <div class="selected-input-wrapper">
                <input type="text" id="selectedInput" placeholder="点击上方推荐文案添加到此处...">
                <button id="translateInputBtn" class="translate-input-btn">🌐 翻译</button>
            </div>
            <button id="confirmBtn" class="confirm-btn">✓ 确认发送</button>
        </div>
    </div>

    <!-- 翻译模块 -->
    <script src="js/translators/translator-base.js"></script>
    <script src="js/translators/google-translator.js"></script>
    <script src="js/translators/baidu-translator.js"></script>
    <script src="js/translators/microsoft-translator.js"></script>
    <script src="js/translators/translator-manager.js"></script>

    <!-- 其他模块 -->
    <script src="js/theme-manager.js"></script>
    <script src="js/post-message.js"></script>
    <script src="js/data-loader.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
