<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏运营选择器 - 多风格翻译版</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="picker-container theme-dark" id="pickerContainer">
        <!-- 圆形关闭按钮 -->
        <button class="circle-close-btn" id="circleCloseBtn">✕</button>

        <div class="picker-header">
            <h3>🎮 游戏运营工具箱</h3>
            <p>选择文案 → 编辑内容 → 确认发送</p>
        </div>

        <!-- 内容面板 -->
        <div class="content-panel">
            <div class="panel-header">
                <span class="panel-title">📝 内容编辑</span>
            </div>
            <div class="input-area">
                <textarea id="contentInput" rows="3" placeholder="选择文案后会自动填入，也可以直接编辑或翻译..."></textarea>
                <div class="input-actions">
                    <button id="translateInputBtn" class="action-icon-btn" title="翻译输入框内容">🌐 翻译</button>
                    <button id="openSettingsBtn" class="action-icon-btn" title="设置">⚙️ 设置</button>
                    <button id="confirmBtn" class="confirm-btn">✓ 确认发送</button>
                </div>
            </div>
        </div>

        <!-- 条件选择栏 - 一行布局 -->
        <div class="filter-bar">
            <div class="filter-item">
                <label>📌 主类型</label>
                <select id="mainTypeSelect">
                    <option value="ban">🚫 封号类型</option>
                    <option value="announcement">📢 停服公告</option>
                    <option value="notice">ℹ️ 系统通知</option>
                    <option value="reward">🎁 补偿公告</option>
                    <option value="maintenance">🔧 维护公告</option>
                </select>
            </div>

            <div class="filter-item">
                <label>🔖 子类型</label>
                <select id="subTypeSelect"></select>
            </div>

            <div class="filter-item search-item">
                <label>🔍 搜索</label>
                <input type="text" id="searchInput" class="search-input" placeholder="关键词...">
            </div>
        </div>

        <!-- 推荐列表 -->
        <div class="recommend-section">
            <div class="section-title">
                📋 推荐文案 <span id="resultCount">0</span>
            </div>
            <ul class="option-list" id="optionList">
                <li class="empty-tip">请选择类型查看推荐</li>
            </ul>
        </div>
    </div>

    <!-- 设置弹窗（包含翻译设置 + 风格设置） -->
    <div id="settingsModal" class="settings-modal" style="display: none;">
        <div class="settings-modal-content">
            <div class="settings-modal-header">
                <span>⚙️ 设置</span>
                <button id="closeSettingsModalBtn" class="close-modal-btn">✕</button>
            </div>
            <div class="settings-modal-body">
                <!-- 标签页切换 -->
                <div class="settings-tabs">
                    <button class="tab-btn active" data-tab="translate">🌐 翻译设置</button>
                    <button class="tab-btn" data-tab="theme">🎨 界面风格</button>
                </div>
                
                <!-- 翻译设置面板 -->
                <div id="translateTab" class="tab-content active">
                    <div class="setting-group">
                        <label>翻译引擎</label>
                        <select id="translatorSelect">
                            <option value="google">Google 翻译</option>
                            <option value="baidu">百度翻译</option>
                            <option value="microsoft">微软翻译</option>
                        </select>
                    </div>
                    <div class="setting-group">
                        <label>目标语言</label>
                        <select id="langSelect">
                            <option value="en">English</option>
                            <option value="zh">中文</option>
                            <option value="ja">日本語</option>
                            <option value="ko">한국어</option>
                            <option value="fr">Français</option>
                            <option value="de">Deutsch</option>
                            <option value="es">Español</option>
                            <option value="ru">Русский</option>
                            <option value="ar">العربية</option>
                            <option value="pt">Português</option>
                        </select>
                    </div>
                    <div class="setting-group">
                        <label>
                            <input type="checkbox" id="autoTranslateCheckbox"> 自动翻译选择的文案
                        </label>
                    </div>
                    <div class="setting-group" id="baiduSettings" style="display: none;">
                        <label>百度 App ID</label>
                        <input type="text" id="baiduAppId" placeholder="输入百度翻译 App ID">
                        <label style="margin-top: 8px;">百度密钥</label>
                        <input type="password" id="baiduSecret" placeholder="输入百度翻译密钥">
                    </div>
                    <div class="setting-group" id="microsoftSettings" style="display: none;">
                        <label>微软 API Key</label>
                        <input type="password" id="msApiKey" placeholder="输入微软翻译 API Key">
                        <label style="margin-top: 8px;">区域</label>
                        <input type="text" id="msRegion" placeholder="global" value="global">
                    </div>
                </div>
                
                <!-- 风格设置面板 -->
                <div id="themeTab" class="tab-content">
                    <div class="setting-group">
                        <label>选择界面风格</label>
                        <div class="theme-buttons" id="themeButtons">
                            <button data-theme="dark" class="theme-option-btn active">🌙 暗夜游戏风</button>
                            <button data-theme="pink" class="theme-option-btn">🌸 清新少女粉</button>
                            <button data-theme="cyber" class="theme-option-btn">💻 科技赛博朋克</button>
                            <button data-theme="white" class="theme-option-btn">📄 简约商务白</button>
                            <button data-theme="red" class="theme-option-btn">🧧 热血中国红</button>
                        </div>
                    </div>
                    <div class="theme-preview" id="themePreview">
                        <div class="preview-card">
                            <span>预览效果</span>
                            <p>这里会显示主题预览效果</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="settings-modal-footer">
                <button id="saveSettingsModalBtn" class="save-modal-btn">保存设置</button>
            </div>
        </div>
    </div>

    <!-- 翻译模块（必须按顺序） -->
    <script src="js/translators/translator-base.js"></script>
    <script src="js/translators/google-translator.js"></script>
    <script src="js/translators/baidu-translator.js"></script>
    <script src="js/translators/microsoft-translator.js"></script>
    <script src="js/translators/translator-manager.js"></script>

    <!-- 其他模块 -->
    <script src="js/theme-manager.js"></script>
    <script src="js/post-message.js"></script>
    <script src="js/data-loader.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
