<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>玩家详情 - PlayFab 管理</title>
    <style>
        /* 样式保持不变，省略... */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #fff; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px 30px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .card { background: rgba(30, 30, 47, 0.8); border-radius: 12px; margin-bottom: 20px; border: 1px solid rgba(99, 102, 241, 0.1); }
        .card-header { padding: 15px 20px; background: rgba(0, 0, 0, 0.2); border-bottom: 1px solid rgba(255, 255, 255, 0.1); font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
        .card-body { padding: 20px; }
        .info-row { display: flex; padding: 8px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .info-label { width: 150px; font-weight: 500; color: #9ca3af; }
        .info-value { flex: 1; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; }
        .badge-banned { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        .badge-normal { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        th { background: rgba(0, 0, 0, 0.3); font-weight: 600; color: #9ca3af; }
        .flex { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        button { padding: 8px 16px; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-success { background: #10b981; color: white; }
        .btn-warning { background: #f59e0b; color: white; }
        .btn-outline { background: transparent; border: 1px solid #2d2d44; color: #fff; }
        code { background: rgba(0, 0, 0, 0.3); padding: 2px 6px; border-radius: 4px; font-family: monospace; }
        .text-center { text-align: center; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 500; font-size: 13px; color: #9ca3af; }
        .form-group input { width: 100%; padding: 10px 12px; background: #14141f; border: 1px solid #2d2d44; border-radius: 8px; color: #fff; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal.show { display: flex; }
        .modal-content { background: #1e1e2f; border-radius: 12px; width: 450px; max-width: 90%; padding: 20px; border: 1px solid #2d2d44; }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #667eea; text-decoration: none; cursor: pointer; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container" id="playerDetailContainer">
        <div class="text-center" style="padding: 40px;">加载中...</div>
    </div>

    <!-- 封禁弹窗 -->
    <div id="banModal" class="modal">
        <div class="modal-content">
            <h3>冻结玩家</h3>
            <div class="form-group">
                <label>冻结原因</label>
                <input type="text" id="banReason" placeholder="请输入冻结原因">
            </div>
            <div class="form-group">
                <label>冻结时长（小时，0表示永久）</label>
                <input type="number" id="banDuration" value="0">
            </div>
            <div class="form-group">
                <label>IP 地址（可选）</label>
                <input type="text" id="banIpAddress" placeholder="例如: 192.168.1.100">
            </div>
            <div class="modal-buttons">
                <button class="btn-outline" onclick="closeBanModal()">取消</button>
                <button class="btn-danger" id="confirmBanBtn">确认冻结</button>
            </div>
        </div>
    </div>

    <!-- 更新封禁弹窗 -->
    <div id="updateBanModal" class="modal">
        <div class="modal-content">
            <h3>更新封禁信息</h3>
            <div class="form-group">
                <label>新原因</label>
                <input type="text" id="updateBanReason" placeholder="请输入新的冻结原因">
            </div>
            <div class="form-group">
                <label>新时长（小时，0表示永久）</label>
                <input type="number" id="updateBanDuration" value="0">
            </div>
            <div class="modal-buttons">
                <button class="btn-outline" onclick="closeUpdateBanModal()">取消</button>
                <button class="btn-primary" id="confirmUpdateBanBtn">确认更新</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { 
            searchPlayerByPlayFabId, 
            banPlayer, 
            unbanPlayer, 
            updateBanInfo,
            getUserData
        } from './js/playfab-api.js';
        
        // 从 URL 获取配置参数
        function getUrlParams() {
            const params = {};
            const queryString = window.location.search;
            if (queryString) {
                const pairs = queryString.substring(1).split('&');
                for (let i = 0; i < pairs.length; i++) {
                    const pair = pairs[i].split('=');
                    params[decodeURIComponent(pair[0])] = decodeURIComponent(pair[1] || '');
                }
            }
            return params;
        }
        
        const urlParams = getUrlParams();
        const playFabId = urlParams.playFabId;
        const TITLE_ID = urlParams.titleId;
        const SECRET_KEY = urlParams.secretKey;
        
        let currentBanId = null;
        
        if (!playFabId) {
            document.getElementById('playerDetailContainer').innerHTML = '<div class="text-center" style="padding: 40px;">缺少玩家ID</div>';
        } else if (!TITLE_ID || !SECRET_KEY) {
            document.getElementById('playerDetailContainer').innerHTML = '<div class="text-center" style="padding: 40px;">缺少配置参数 titleId 或 secretKey</div>';
        } else {
            loadPlayerDetail();
        }
        
        async function loadPlayerDetail() {
            try {
                const player = await searchPlayerByPlayFabId(TITLE_ID, SECRET_KEY, playFabId);
                if (!player) {
                    document.getElementById('playerDetailContainer').innerHTML = '<div class="text-center" style="padding: 40px;">未找到玩家</div>';
                    return;
                }
                
                // 获取用户自定义数据
                let userData = null;
                try {
                    userData = await getUserData(TITLE_ID, SECRET_KEY, playFabId);
                } catch (err) {
                    console.error('获取用户数据失败:', err);
                }
                
                renderPlayerDetail(player, userData);
            } catch (err) {
                document.getElementById('playerDetailContainer').innerHTML = `<div class="text-center" style="padding: 40px;">加载失败: ${err.message}</div>`;
            }
        }
        
        function renderPlayerDetail(player, userData) {
            const isBanned = player.isBanned;
            currentBanId = player.banId;
            
            let html = `
                <a class="back-link" onclick="window.close()">← 关闭窗口</a>
                
                <div class="header">
                    <div>
                        <h1>🎮 玩家详情</h1>
                        <p>PlayFab ID: <code>${escapeHtml(playFabId)}</code></p>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header">📋 基本信息</div>
                    <div class="card-body">
                        <div class="info-row"><div class="info-label">PlayFab ID</div><div class="info-value"><code>${escapeHtml(player.playFabId)}</code></div></div>
                        <div class="info-row"><div class="info-label">显示名</div><div class="info-value">${escapeHtml(player.displayName || '-')}</div></div>
                        <div class="info-row"><div class="info-label">邮箱</div><div class="info-value">${escapeHtml(player.email || '-')}</div></div>
                        <div class="info-row"><div class="info-label">创建时间</div><div class="info-value">${player.createdTime ? new Date(player.createdTime).toLocaleString() : '-'}</div></div>
                        <div class="info-row"><div class="info-label">最后登录</div><div class="info-value">${player.lastLoginTime ? new Date(player.lastLoginTime).toLocaleString() : '-'}</div></div>
                        <div class="info-row"><div class="info-label">状态</div><div class="info-value"><span class="badge ${isBanned ? 'badge-banned' : 'badge-normal'}">${isBanned ? '已冻结' : '正常'}</span></div></div>
            `;
            
            if (isBanned) {
                html += `
                    <div class="info-row"><div class="info-label">冻结原因</div><div class="info-value">${escapeHtml(player.banReason || '未提供')}</div></div>
                    <div class="info-row"><div class="info-label">冻结到期时间</div><div class="info-value">${player.banExpires ? new Date(player.banExpires).toLocaleString() : '永久'}</div></div>
                `;
            }
            
            html += `
                    </div>
                </div>
            `;
            
            // 用户自定义数据
            if (userData && userData.Data && Object.keys(userData.Data).length > 0) {
                html += `
                <div class="card">
                    <div class="card-header">💾 玩家自定义数据</div>
                    <div class="card-body">
                        <div class="table-container">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Key</th>
                                        <th>Value</th>
                                    </tr>
                                </thead>
                                <tbody>
                `;
                
                for (const [key, value] of Object.entries(userData.Data)) {
                    const displayValue = value.Value || JSON.stringify(value);
                    html += `
                        <tr>
                            <td><code>${escapeHtml(key)}</code></td>
                            <td style="max-width:400px; word-break:break-all;">${escapeHtml(displayValue)}</td>
                        </tr>
                    `;
                }
                
                html += `
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                `;
            } else {
                html += `
                <div class="card">
                    <div class="card-header">💾 玩家自定义数据</div>
                    <div class="card-body">
                        <div class="text-center" style="padding: 20px; color: #9ca3af;">暂无玩家自定义数据</div>
                    </div>
                </div>
                `;
            }
            
            // 快捷操作
            html += `
                <div class="card">
                    <div class="card-header">⚡ 快捷操作</div>
                    <div class="card-body">
                        <div class="flex">
                            <button class="btn-primary" onclick="location.reload()">🔄 刷新数据</button>
            `;
            
            if (isBanned) {
                html += `
                    <button class="btn-warning" id="updateBanBtn">✏️ 更新封禁</button>
                    <button class="btn-success" id="unbanBtn">🔓 解冻账号</button>
                `;
            } else {
                html += `
                    <button class="btn-danger" id="banBtn">🔒 冻结账号</button>
                `;
            }
            
            html += `
                        </div>
                    </div>
                </div>
            `;
            
            document.getElementById('playerDetailContainer').innerHTML = html;
            
            // 绑定事件
            if (isBanned) {
                document.getElementById('updateBanBtn')?.addEventListener('click', showUpdateBanModal);
                document.getElementById('unbanBtn')?.addEventListener('click', unbanPlayerAction);
            } else {
                document.getElementById('banBtn')?.addEventListener('click', showBanModal);
            }
        }
        
        function showBanModal() {
            const modal = document.getElementById('banModal');
            if (modal) modal.classList.add('show');
            document.getElementById('banReason').value = '';
            document.getElementById('banDuration').value = '0';
            document.getElementById('banIpAddress').value = '';
        }
        
        function closeBanModal() {
            const modal = document.getElementById('banModal');
            if (modal) modal.classList.remove('show');
        }
        
        async function confirmBan() {
            const reason = document.getElementById('banReason').value;
            const duration = parseInt(document.getElementById('banDuration').value);
            const ipAddress = document.getElementById('banIpAddress').value;
            
            if (!reason) {
                alert('请输入冻结原因');
                return;
            }
            
            const confirmBtn = document.getElementById('confirmBanBtn');
            if (confirmBtn) {
                confirmBtn.disabled = true;
                confirmBtn.textContent = '处理中...';
            }
            
            try {
                await banPlayer(TITLE_ID, SECRET_KEY, playFabId, reason, duration, ipAddress);
                alert('冻结成功');
                closeBanModal();
                location.reload();
            } catch (err) {
                alert('冻结失败: ' + err.message);
            } finally {
                if (confirmBtn) {
                    confirmBtn.disabled = false;
                    confirmBtn.textContent = '确认冻结';
                }
            }
        }
        
        function showUpdateBanModal() {
            const modal = document.getElementById('updateBanModal');
            if (modal) modal.classList.add('show');
            document.getElementById('updateBanReason').value = '';
            document.getElementById('updateBanDuration').value = '0';
        }
        
        function closeUpdateBanModal() {
            const modal = document.getElementById('updateBanModal');
            if (modal) modal.classList.remove('show');
        }
        
        async function confirmUpdateBan() {
            const reason = document.getElementById('updateBanReason').value;
            const duration = parseInt(document.getElementById('updateBanDuration').value);
            
            if (!reason) {
                alert('请输入冻结原因');
                return;
            }
            
            const confirmBtn = document.getElementById('confirmUpdateBanBtn');
            if (confirmBtn) {
                confirmBtn.disabled = true;
                confirmBtn.textContent = '处理中...';
            }
            
            try {
                await updateBanInfo(TITLE_ID, SECRET_KEY, currentBanId, reason, duration);
                alert('更新成功');
                closeUpdateBanModal();
                location.reload();
            } catch (err) {
                alert('更新失败: ' + err.message);
            } finally {
                if (confirmBtn) {
                    confirmBtn.disabled = false;
                    confirmBtn.textContent = '确认更新';
                }
            }
        }
        
        async function unbanPlayerAction() {
            if (!confirm('确定要解冻该玩家吗？')) return;
            
            try {
                await unbanPlayer(TITLE_ID, SECRET_KEY, playFabId);
                alert('解冻成功');
                location.reload();
            } catch (err) {
                alert('解冻失败: ' + err.message);
            }
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        
        // 全局函数
        window.closeBanModal = closeBanModal;
        window.closeUpdateBanModal = closeUpdateBanModal;
        window.confirmBan = confirmBan;
        window.confirmUpdateBan = confirmUpdateBan;
    </script>
</body>
</html>
