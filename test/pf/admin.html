<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayFab 管理后台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #fff;
            min-height: 100vh;
        }
        
        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .playfab-toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 20px;
            border-radius: 8px;
            color: white;
            z-index: 2000;
            display: none;
        }
        
        /* 模态框 */
        .playfab-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1001;
        }
        
        .playfab-modal.show {
            display: flex;
        }
        
        .playfab-modal-content {
            background: #1e1e2f;
            border-radius: 12px;
            width: 450px;
            max-width: 90%;
            padding: 20px;
            border: 1px solid #2d2d44;
        }
        
        .playfab-modal-content h3 {
            margin-bottom: 15px;
        }
        
        .playfab-modal-content .form-group {
            margin-bottom: 15px;
        }
        
        .playfab-modal-content .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            color: #9ca3af;
        }
        
        .playfab-modal-content .form-group input {
            width: 100%;
            padding: 10px 12px;
            background: #14141f;
            border: 1px solid #2d2d44;
            border-radius: 8px;
            color: #fff;
        }
        
        .playfab-modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
        
        .playfab-btn-outline {
            background: transparent;
            border: 1px solid #2d2d44;
            color: #fff;
        }
        
        .playfab-btn-danger {
            background: #ef4444;
            color: white;
        }
        
        .playfab-btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #9ca3af;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div id="playfabContent">
            <div class="loading">加载中...</div>
        </div>
    </div>
    
    <div id="playfabToast" class="playfab-toast"></div>
    
    <!-- 封禁弹窗 -->
    <div id="playfabBanModal" class="playfab-modal">
        <div class="playfab-modal-content">
            <h3>冻结玩家</h3>
            <div class="form-group">
                <label>冻结原因</label>
                <input type="text" id="banReason" placeholder="请输入冻结原因">
            </div>
            <div class="form-group">
                <label>冻结时长（小时，0表示永久）</label>
                <input type="number" id="banDuration" value="0">
            </div>
            <div class="form-group">
                <label>IP 地址（可选）</label>
                <input type="text" id="banIpAddress" placeholder="例如: 192.168.1.100">
            </div>
            <div class="playfab-modal-buttons">
                <button class="playfab-btn playfab-btn-outline" onclick="closeBanModal()">取消</button>
                <button class="playfab-btn playfab-btn-danger" id="confirmBanBtn">确认冻结</button>
            </div>
        </div>
    </div>
    
    <!-- 更新封禁弹窗 -->
    <div id="playfabUpdateBanModal" class="playfab-modal">
        <div class="playfab-modal-content">
            <h3>更新封禁信息</h3>
            <div class="form-group">
                <label>新原因</label>
                <input type="text" id="updateBanReason" placeholder="请输入新的冻结原因">
            </div>
            <div class="form-group">
                <label>新时长（小时，0表示永久）</label>
                <input type="number" id="updateBanDuration" value="0">
            </div>
            <div class="playfab-modal-buttons">
                <button class="playfab-btn playfab-btn-outline" onclick="closeUpdateBanModal()">取消</button>
                <button class="playfab-btn playfab-btn-primary" id="confirmUpdateBanBtn">确认更新</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initPlayFabAdmin } from './js/playfab-admin.js';
        
        // 从 URL 获取配置参数
        function getUrlParams() {
            const params = {};
            const queryString = window.location.search;
            if (queryString) {
                const pairs = queryString.substring(1).split('&');
                for (let i = 0; i < pairs.length; i++) {
                    const pair = pairs[i].split('=');
                    params[decodeURIComponent(pair[0])] = decodeURIComponent(pair[1] || '');
                }
            }
            return params;
        }
        
        const urlParams = getUrlParams();
        const titleId = urlParams.titleId || urlParams.titleid;
        const secretKey = urlParams.secretKey || urlParams.secretkey;
        
        // 检查配置是否完整
        if (!titleId || !secretKey) {
            document.getElementById('playfabContent').innerHTML = `
                <div style="background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; padding: 20px; border-radius: 12px; text-align: center;">
                    <strong>❌ 配置错误</strong><br>
                    缺少必要的参数，请通过 URL 传入 titleId 和 secretKey<br><br>
                    示例: <code style="background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 6px;">admin.html?titleId=XXXX&secretKey=XXXX</code>
                </div>
            `;
        } else {
            // 加载 PlayFab 管理界面 HTML
            fetch('./playfab-admin.html')
                .then(res => {
                    if (!res.ok) {
                        throw new Error('模板文件不存在');
                    }
                    return res.text();
                })
                .then(html => {
                    document.getElementById('playfabContent').innerHTML = html;
                    // 初始化 PlayFab 管理模块，传入配置
                    initPlayFabAdmin(titleId, secretKey);
                })
                .catch(err => {
                    document.getElementById('playfabContent').innerHTML = `<div class="loading">加载模板失败: ${err.message}<br>请确保 playfab-admin.html 文件存在</div>`;
                });
        }
        
        // 全局函数
        window.closeBanModal = function() {
            const modal = document.getElementById('playfabBanModal');
            if (modal) modal.style.display = 'none';
        };
        
        window.closeUpdateBanModal = function() {
            const modal = document.getElementById('playfabUpdateBanModal');
            if (modal) modal.style.display = 'none';
        };
    </script>
</body>
</html>
