<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏运营选择器 - 测试网页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* 测试卡片 */
        .test-card {
            background: white;
            border-radius: 24px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .test-card h2 {
            color: #333;
            margin-bottom: 8px;
            font-size: 24px;
        }

        .test-card .desc {
            color: #666;
            margin-bottom: 24px;
            font-size: 14px;
            border-left: 3px solid #667eea;
            padding-left: 12px;
        }

        /* 表单样式 */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #555;
            font-size: 14px;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
        }

        .input-wrapper input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.2s;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background: #5a67d8;
            transform: translateY(-2px);
        }

        /* 快捷测试区域 */
        .quick-test {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        .quick-btn {
            background: #f0f0f0;
            color: #333;
            padding: 8px 16px;
            font-size: 12px;
        }

        .quick-btn:hover {
            background: #e0e0e0;
            transform: translateY(-1px);
        }

        /* 日志区域 */
        .log-section {
            background: #1e1e2e;
            border-radius: 16px;
            padding: 20px;
            color: #ccc;
            font-family: monospace;
            font-size: 13px;
        }

        .log-section h3 {
            color: #fff;
            margin-bottom: 12px;
            font-size: 16px;
        }

        .log-content {
            background: #0a0a14;
            border-radius: 12px;
            padding: 16px;
            height: 200px;
            overflow-y: auto;
        }

        .log-entry {
            padding: 6px 0;
            border-bottom: 1px solid #2a2a3a;
            font-size: 12px;
        }

        .log-entry .time {
            color: #667eea;
            margin-right: 12px;
        }

        .log-entry .type {
            color: #ffd700;
            margin-right: 12px;
        }

        .clear-log {
            margin-top: 12px;
            background: #2a2a3a;
            color: #ccc;
            padding: 6px 12px;
            font-size: 12px;
        }

        .clear-log:hover {
            background: #3a3a4a;
        }

        /* 状态指示器 */
        .status {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status.online {
            background: #4ade80;
            box-shadow: 0 0 5px #4ade80;
        }

        .status.offline {
            background: #f87171;
        }

        /* iframe 模态框 */
        .picker-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 10000;
            justify-content: center;
            align-items: center;
        }

        .picker-iframe {
            width: 560px;
            height: 620px;
            border: none;
            border-radius: 24px;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.3);
            animation: fadeInScale 0.2s ease;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .close-overlay {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            cursor: pointer;
            background: rgba(0,0,0,0.5);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .close-overlay:hover {
            background: rgba(0,0,0,0.8);
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 状态卡片 -->
        <div class="test-card">
            <h2>
                <span class="status" id="statusDot"></span>
                游戏运营选择器 - 测试面板
            </h2>
            <div class="desc">测试选择器的跨域通信功能，点击按钮打开选择器，选择文案后自动填入输入框</div>
            
            <div class="form-group">
                <label>📝 公告内容输入框（测试用）</label>
                <div class="input-wrapper">
                    <input type="text" id="testInput" placeholder="点击下方按钮打开选择器，选中的文案会填到这里">
                    <button id="openPickerBtn">📋 打开选择器</button>
                </div>
            </div>

            <div class="form-group">
                <label>🎯 快捷测试（直接填入示例）</label>
                <div class="quick-test">
                    <button class="quick-btn" data-text="【停服公告】全服将于8月20日02:00-06:00停服维护">停服示例</button>
                    <button class="quick-btn" data-text="使用外挂/脚本，帐号已被永久封禁">封号示例</button>
                    <button class="quick-btn" data-text="【限时活动】双倍经验卡限时上架，仅售3天">活动示例</button>
                    <button class="quick-btn" data-text="【维护补偿】全服发放招募券*10 + 金币*50000">补偿示例</button>
                </div>
            </div>
        </div>

        <!-- 日志卡片 -->
        <div class="test-card">
            <h2>📡 通信日志</h2>
            <div class="desc">记录选择器与父页面的 postMessage 通信内容</div>
            
            <div class="log-section">
                <div class="log-content" id="logContent">
                    <div class="log-entry">等待选择器消息...</div>
                </div>
                <button class="clear-log" id="clearLogBtn">清空日志</button>
            </div>
        </div>

        <div class="test-card">
            <h2>🔗 嵌入信息</h2>
            <div class="desc">选择器地址和通信配置</div>
            <div style="background: #f5f5f5; padding: 12px; border-radius: 12px; font-size: 13px; word-break: break-all;">
                <strong>选择器 URL：</strong><br>
                https://testdew.github.io/unity_web/test/game-picker/index.html
            </div>
            <div style="margin-top: 12px; font-size: 13px; color: #666;">
                💡 提示：选择器会通过 postMessage 发送 TEXT_SELECTED 和 PICKER_CLOSED 消息
            </div>
        </div>
    </div>

    <!-- 选择器模态框 -->
    <div id="pickerOverlay" class="picker-overlay">
        <div class="close-overlay" id="closeOverlayBtn">×</div>
        <iframe id="pickerIframe" class="picker-iframe" src="https://testdew.github.io/unity_web/test/game-picker/index.html"></iframe>
    </div>

    <script>
        // DOM 元素
        const overlay = document.getElementById('pickerOverlay');
        const iframe = document.getElementById('pickerIframe');
        const openPickerBtn = document.getElementById('openPickerBtn');
        const testInput = document.getElementById('testInput');
        const logContent = document.getElementById('logContent');
        const clearLogBtn = document.getElementById('clearLogBtn');
        const closeOverlayBtn = document.getElementById('closeOverlayBtn');
        const statusDot = document.getElementById('statusDot');

        let currentTargetId = null;
        let pickerReady = false;

        // 添加日志
        function addLog(type, data) {
            const time = new Date().toLocaleTimeString();
            const logDiv = document.createElement('div');
            logDiv.className = 'log-entry';
            logDiv.innerHTML = `
                <span class="time">[${time}]</span>
                <span class="type">${type}</span>
                <span>${JSON.stringify(data, null, 0)}</span>
            `;
            logContent.appendChild(logDiv);
            logDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            
            // 保留最近 50 条日志，避免过多
            while (logContent.children.length > 50) {
                logContent.removeChild(logContent.firstChild);
            }
        }

        // 清空日志
        clearLogBtn.addEventListener('click', () => {
            logContent.innerHTML = '<div class="log-entry">日志已清空</div>';
            addLog('系统', { action: '日志已清空' });
        });

        // 打开选择器
        function openPicker(targetInputId) {
            currentTargetId = targetInputId;
            overlay.style.display = 'flex';
            addLog('打开选择器', { target: targetInputId });
            
            // 可选：给 iframe 发送一个准备就绪的询问
            setTimeout(() => {
                iframe.contentWindow.postMessage({ type: 'PING' }, '*');
            }, 100);
        }

        // 关闭选择器
        function closePicker() {
            overlay.style.display = 'none';
            currentTargetId = null;
            addLog('关闭选择器', {});
        }

        // 监听来自 iframe 的消息
        window.addEventListener('message', function(event) {
            // 验证消息来源（可选，生产环境建议严格验证）
            const expectedOrigin = 'https://testdew.github.io';
            if (event.origin !== expectedOrigin) {
                addLog('⚠️ 未知来源', { origin: event.origin, data: event.data });
                return;
            }
            
            const data = event.data;
            addLog('收到消息', { origin: event.origin, ...data });
            
            // 处理选择器返回的文本
            if (data.type === 'TEXT_SELECTED' && currentTargetId) {
                const targetInput = document.getElementById(currentTargetId);
                if (targetInput) {
                    const oldValue = targetInput.value;
                    targetInput.value = data.value;
                    addLog('✅ 填入成功', {
                        输入框: currentTargetId,
                        原值: oldValue,
                        新值: data.value,
                        分类: data.category
                    });
                    
                    // 高亮效果
                    targetInput.style.backgroundColor = '#e8f4ff';
                    setTimeout(() => {
                        targetInput.style.backgroundColor = '';
                    }, 500);
                } else {
                    addLog('❌ 目标输入框不存在', { targetId: currentTargetId });
                }
                closePicker();
            }
            // 处理关闭事件
            else if (data.type === 'PICKER_CLOSED') {
                addLog('选择器主动关闭', {});
                closePicker();
            }
            // 处理选择器就绪消息
            else if (data.type === 'PICKER_READY') {
                pickerReady = true;
                statusDot.className = 'status online';
                addLog('✅ 选择器已就绪', {});
            }
            // 处理 ping 响应
            else if (data.type === 'PONG') {
                addLog('🏓 选择器响应正常', {});
                statusDot.className = 'status online';
            }
            // 其他消息
            else {
                addLog('📨 其他消息', data);
            }
        });

        // 监听 iframe 加载完成
        iframe.addEventListener('load', () => {
            addLog('iframe 加载完成', { url: iframe.src });
            // 尝试发送 ping 检测连接
            setTimeout(() => {
                iframe.contentWindow.postMessage({ type: 'PING' }, '*');
            }, 500);
        });

        // 打开按钮点击
        openPickerBtn.addEventListener('click', () => {
            openPicker('testInput');
        });

        // 关闭模态框按钮
        closeOverlayBtn.addEventListener('click', closePicker);
        
        // 点击背景关闭
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) {
                closePicker();
            }
        });

        // 快捷测试按钮
        document.querySelectorAll('.quick-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const text = btn.getAttribute('data-text');
                if (text) {
                    testInput.value = text;
                    addLog('快捷测试', { 填入值: text });
                    
                    // 高亮效果
                    testInput.style.backgroundColor = '#e8f4ff';
                    setTimeout(() => {
                        testInput.style.backgroundColor = '';
                    }, 500);
                }
            });
        });

        // 页面加载完成时的初始化日志
        addLog('系统', { status: '测试页面已启动', 选择器地址: iframe.src });
        
        // 延迟检测选择器是否可访问
        setTimeout(() => {
            if (!pickerReady) {
                statusDot.className = 'status offline';
                addLog('⚠️ 选择器未响应', { 提示: '请检查选择器地址是否正确，是否支持跨域通信' });
            }
        }, 3000);
    </script>
</body>
</html>
